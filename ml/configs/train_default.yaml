project:
  name: coastwatch-impactnet
  timezone_storage: UTC
  shadow_mode: true
  synthetic_data: false

scope:
  country: England
  hazard: coastal_flood_impact
  label_mode: confirmed_impact
  allowed_label_confidence: [A, B]

windows:
  history_hours: 72
  forecast_hours: 24
  output_horizons_hours: [1, 3, 6, 12, 24]

mode:
  data_mode: operational_backtest
  model_variant: hybrid_tcn

features:
  include_missing_masks: true
  include_source_age: true
  include_static_features: true
  use_site_embedding: false
  water_target_mode: residual

split:
  train_end: "2022-12-31T23:00:00Z"
  validation_end: "2024-12-31T23:00:00Z"
  test_end: "2026-06-30T23:00:00Z"
  target_purge_hours: 24
  event_buffer_hours: 72

model:
  hidden_channels: 64
  num_blocks: 5
  kernel_size: 3
  dilations: [1, 2, 4, 8, 16]
  dropout: 0.2
  decoder_hidden_dim: 128
  lead_embedding_dim: 8

training:
  seed: 20260813
  batch_size: 128
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 12
  mixed_precision: true

loss:
  event_weight: 1.0
  water_weight: 0.4
  warning_aux_weight: 0.2
  severity_aux_weight: 0.2
  max_pos_weight: 20.0

calibration:
  method: global_temperature

alerts:
  merge_gap_hours: 2
  cooldown_hours: 6
  match_lookahead_hours: 24

quality:
  max_missing_fraction_past: 0.25
  max_missing_fraction_future: 0.25
  max_tide_age_minutes: 90
  max_weather_forecast_age_hours: 12
  max_wave_age_hours: 6

