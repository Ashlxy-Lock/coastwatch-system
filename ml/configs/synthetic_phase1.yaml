project:
  name: coastwatch-impactnet
  timezone_storage: UTC
  shadow_mode: true
  synthetic_data: true

scope:
  country: Synthetic
  hazard: synthetic_coastal_impact_fixture
  label_mode: confirmed_impact
  allowed_label_confidence: [A, B]

windows:
  history_hours: 72
  forecast_hours: 24
  output_horizons_hours: [1, 3, 6, 12, 24]

mode:
  data_mode: hindcast_research
  model_variant: obs_only_tcn

features:
  include_missing_masks: true
  include_source_age: true
  include_static_features: true
  use_site_embedding: false
  water_target_mode: absolute

split:
  train_end: "2025-04-18T23:00:00Z"
  validation_end: "2025-05-24T23:00:00Z"
  test_end: "2025-06-29T23:00:00Z"
  target_purge_hours: 24
  event_buffer_hours: 72

model:
  hidden_channels: 8
  num_blocks: 2
  kernel_size: 3
  dilations: [1, 2]
  dropout: 0.1
  decoder_hidden_dim: 24
  lead_embedding_dim: 4

training:
  seed: 20260813
  batch_size: 32
  max_epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 3
  mixed_precision: false

loss:
  event_weight: 1.0
  water_weight: 0.4
  max_pos_weight: 20.0

calibration:
  method: global_temperature

alerts:
  merge_gap_hours: 2
  cooldown_hours: 6
  match_lookahead_hours: 24
