[platformio]
default_envs = stm32f103zet6

[env:stm32f103zet6]
platform = ststm32@19.7.0
board = genericSTM32F103ZE
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D HSE_VALUE=8000000UL
    -D COASTWATCH_FIRMWARE=1
build_src_filter =
    +<*>

; Pure logic can also be built and tested on a PC. The checked-in host test
; runner uses MSVC directly, so this environment is optional.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<coastwatch_logic.cpp>
    +<protocol.cpp>
    -<main.cpp>

