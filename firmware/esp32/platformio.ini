[platformio]
default_envs = esp32s3-n16r8

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[env:esp32s3-n16r8]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = default
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200

; ESP32-S3-WROOM-1-N16R8: 16 MB Quad SPI flash + 8 MB Octal SPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<protocol.cpp>
    +<environment.cpp>
    +<risk_snapshot.cpp>
    +<model_control.cpp>

; Compile-only target for checking the host tests against the actual ESP32
; compiler without replacing the firmware currently flashed on the board.
[env:esp32s3-test]
extends = env:esp32s3-n16r8
test_build_src = yes
build_src_filter =
    +<protocol.cpp>
    +<environment.cpp>
    +<risk_snapshot.cpp>
    +<model_control.cpp>
